name: Build AERA Recovery (mt6853)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  # ==================== Job 1: 编译内核 ====================
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kernel build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make bc bison flex cpio libssl-dev libelf-dev python3 git
          # ubuntu-22.04 仓库无 gcc-8，从 focal 源取 aarch64 交叉编译器
          echo "deb http://archive.ubuntu.com/ubuntu focal main universe" | sudo tee /etc/apt/sources.list.d/focal.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-8-aarch64-linux-gnu cpp-8-aarch64-linux-gnu
          # 内核 Makefile 用 CROSS_COMPILE=aarch64-linux-gnu- 找 aarch64-linux-gnu-gcc，focal 只有带版本号的
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-8 /usr/bin/aarch64-linux-gnu-gcc
          sudo ln -sf /usr/bin/aarch64-linux-gnu-cpp-8 /usr/bin/aarch64-linux-gnu-cpp 2>/dev/null || true
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b android-12 \
            https://github.com/lijilong34/android_kernel_oppo_mt6853.git kernel

      - name: Patch kernel (illegal inline / weak fn / cameraisp hardcoded obj-y)
        run: |
          cd kernel
          # cameraisp 是 obj-y 硬编码，不受 CONFIG_MTK_CAMERA_ISP 控制；关配置后仍编译会链接失败
          sed -i 's|^obj-y += cameraisp/|obj-$(CONFIG_MTK_CAMERA_ISP) += cameraisp/|' drivers/misc/mediatek/Makefile
          grep -n 'cameraisp' drivers/misc/mediatek/Makefile
          sed -i 's/^inline void ksm_flock(/void ksm_flock(/' include/linux/keyslot-manager.h
          sed -i 's/^inline void blk_crypto_flock(/void blk_crypto_flock(/' include/linux/blk-crypto.h
          sed -i 's/^__attribute__((weak)) int register_lcdinfo_notifier() {/__attribute__((weak)) int register_lcdinfo_notifier(struct notifier_block *nb) {/' \
            drivers/misc/mediatek/sensor/2.0/oplus_sensor_devinfo/sensor_devinfo.c
          sed -i 's/^__attribute__((weak)) int unregister_lcdinfo_notifier() {/__attribute__((weak)) int unregister_lcdinfo_notifier(struct notifier_block *nb) {/' \
            drivers/misc/mediatek/sensor/2.0/oplus_sensor_devinfo/sensor_devinfo.c

      - name: Configure + build kernel
        run: |
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          MKARGS="ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=aarch64-linux-gnu-gcc HOSTCC=gcc"
          make O=out $MKARGS mt6853_defconfig
          sed -i -E '
            s/^CONFIG_MTK_IMGSENSOR=y/# CONFIG_MTK_IMGSENSOR is not set/
            s/^CONFIG_MTK_LENS=y/# CONFIG_MTK_LENS is not set/
            s/^CONFIG_CUSTOM_KERNEL_IMGSENSOR=.*/# CONFIG_CUSTOM_KERNEL_IMGSENSOR is not set/
            s/^CONFIG_MTK_CAMERA_ISP=y/# CONFIG_MTK_CAMERA_ISP is not set/
            s/^CONFIG_MTK_COMBO_BT=y/# CONFIG_MTK_COMBO_BT is not set/
            s/^CONFIG_MTK_COMBO_GPS=y/# CONFIG_MTK_COMBO_GPS is not set/
            s/^CONFIG_IKHEADERS=y/# CONFIG_IKHEADERS is not set/
          ' out/.config
          make O=out $MKARGS olddefconfig
          echo "=== 关键启动配置（必须全 =y）==="
          grep -E '^(CONFIG_RELOCATABLE|CONFIG_RANDOMIZE_BASE|CONFIG_MTK_COMBO_WIFI|CONFIG_ARM64_MODULE_PLTS)=' out/.config
          make O=out $MKARGS -j$(nproc) Image.gz
          ls -la out/arch/arm64/boot/Image.gz

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: mt6853-kernel
          path: kernel/out/arch/arm64/boot/Image.gz
          retention-days: 30

  # ==================== Job 2: AERA Recovery ====================
  recovery:
    needs: kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AOSP build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git python3 python3-pip openjdk-11-jdk-headless \
            bc bison flex libssl-dev libelf-dev zip unzip curl \
            gcc g++ make libncurses5 libtinfo5 rsync ccache \
            zlib1g-dev libxml2-utils xsltproc imagemagick

      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: mt6853-kernel
          path: kernel-out

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "ci"
          git config --global user.email "ci@ci"
          git config --global color.ui false

      - name: Init AERA manifest (aera-16.0)
        run: |
          mkdir -p ~/aera && cd ~/aera
          repo init -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0 --depth=1
          sed -n '1,15p' .repo/manifests/default.xml

      - name: Sync AERA source
        run: |
          cd ~/aera
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync
          echo "=== synced ==="
          ls

      - name: Inject mt6853 device tree + kernel
        run: |
          cd ~/aera
          mkdir -p device/oppo/mt6853
          # 只同步设备树文件，排除 .git / .github / kernel 编译目录
          rsync -a --delete             --exclude='.git' --exclude='.github' --exclude='kernel'             --exclude='kernel-out' --exclude='out-img' --exclude='*.zip'             $GITHUB_WORKSPACE/ device/oppo/mt6853/
          mkdir -p device/oppo/mt6853/prebuilt
          cp $GITHUB_WORKSPACE/kernel-out/Image.gz device/oppo/mt6853/prebuilt/kernel
          echo "=== device tree ==="
          ls -la device/oppo/mt6853/
          echo "=== AndroidProducts.mk ==="
          cat device/oppo/mt6853/AndroidProducts.mk
          echo "=== 目标 mk 是否存在 ==="
          ls -la device/oppo/mt6853/twrp_mt6853.mk || echo "MISSING twrp_mt6853.mk"
          echo "=== AOSP 自己的搜索能否找到 AndroidProducts.mk ==="
          find device vendor -maxdepth 6 -name AndroidProducts.mk 2>/dev/null | grep -i mt6853 || echo "AOSP find 找不到 mt6853 的 AndroidProducts.mk"
          echo "=== vendor/twrp 是否 sync 到 ==="
          ls -d vendor/twrp vendor/recovery 2>/dev/null || echo "vendor/twrp 与 vendor/recovery 都不存在"
          ls vendor/twrp/config/common.mk 2>/dev/null || echo "vendor/twrp/config/common.mk 不存在"
          echo "=== prebuilt ==="
          ls -la device/oppo/mt6853/prebuilt/

      - name: Show available lunch targets
        run: |
          cd ~/aera
          source build/envsetup.sh
          echo "=== 含 mt6853 / aera 的 lunch 目标 ==="
          lunch 2>&1 | grep -iE 'mt6853|aera' | head -20 || true

      - name: Build AERA recovery
        run: |
          cd ~/aera
          source build/envsetup.sh
          # AOSP16 的 lunch 要求 <product>-<release>-<variant> 三段式，
          # 从 lunch 列表里自动挑出 mt6853 的目标，避免格式硬编码
          echo "=== release_configs 目录 ==="
          ls build/release/release_configs/ 2>/dev/null | head -20 || echo "(目录不存在)"
          # 文件名是 ap2a.textproto 形式，release 名要去掉 .textproto
          RELEASES=$(ls build/release/release_configs/*.textproto 2>/dev/null | sed 's|.*/||;s|\.textproto$||' | grep -vE '^(eng|user|userdebug|root)$' | sort -r)
          echo "候选 release: $(echo $RELEASES)"
          set +e
          OK=
          for R in $RELEASES; do
            echo "=== 尝试 release: $R ==="
            if lunch "twrp_mt6853-${R}-eng" </dev/null 2>&1 | tail -5; then
              if [ -n "$(get_build_var TARGET_DEVICE 2>/dev/null)" ]; then
                echo "OK release=$R"; OK="$R"; break
              fi
            fi
            echo "release $R 不可用"
          done
          set -e
          if [ -z "$OK" ]; then echo "ERROR: 所有 release 都失败"; exit 1; fi
          echo "最终使用: twrp_mt6853-${OK}-eng"
          set -x
          lunch "twrp_mt6853-${OK}-eng" </dev/null
          set +x
          mka recoveryimage -j$(nproc)
          echo "=== AERA 构建成功 ==="

      - name: Collect recovery image
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/out-img
          find ~/aera/out/target/product -maxdepth 3 \( -name "recovery.img" -o -name "RECOVERY_FROM_BOOT" \) \
            -exec cp {} $GITHUB_WORKSPACE/out-img/ \; 2>/dev/null
          ls -la $GITHUB_WORKSPACE/out-img/ || echo "无产物"

      - name: Upload recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt6853-aera-recovery
          path: out-img/
          retention-days: 30
          if-no-files-found: warn
